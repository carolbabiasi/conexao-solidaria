# Infraestrutura de desenvolvimento local da Conexao Solidaria.
#
# Uso:
#   cd docker
#   cp .env.example .env
#   docker compose up -d
#   docker compose ps          # todos devem ficar "healthy"
#   docker compose down        # para tudo (mantem os volumes)
#   docker compose down -v     # para tudo e APAGA os dados
#
# Portas expostas no host:
#   5432   PostgreSQL
#   27017  MongoDB
#   5672   RabbitMQ (AMQP, usado pela aplicacao)
#   15672  RabbitMQ Management UI ...... http://localhost:15672
#   9090   Prometheus ................. http://localhost:9090
#   3000   Grafana .................... http://localhost:3000
#
# As versoes das imagens estao fixadas de proposito: o professor precisa
# conseguir reproduzir o ambiente meses depois.

name: conexao-solidaria

services:

  # ------------------------------------------------- PostgreSQL
  # Banco relacional: Usuarios, Campanhas, Doacoes e tabelas de Outbox.
  postgres:
    image: postgres:17.2-alpine
    container_name: cs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gestorong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-conexaosolidaria}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gestorong} -d ${POSTGRES_DB:-conexaosolidaria}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [conexao-solidaria]

  # ------------------------------------------------- MongoDB
  # Ledger append-only de doacoes processadas (auditoria e idempotencia).
  mongo:
    image: mongo:8.0
    container_name: cs-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-gestorong}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?defina MONGO_PASSWORD no .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-conexaosolidaria}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [conexao-solidaria]

  # ------------------------------------------------- RabbitMQ
  # Broker do DoacaoRecebidaEvent. A Management UI e o que aparece no video.
  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: cs-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gestorong}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no .env}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks: [conexao-solidaria]

  # ------------------------------------------------- Prometheus
  # Coleta as metricas expostas em /metrics (ver OBS-02).
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: cs-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [conexao-solidaria]

  # ------------------------------------------------- Grafana
  # Dashboard exigido pelo edital (ver OBS-05 e OBS-06).
  grafana:
    image: grafana/grafana:11.5.1
    container_name: cs-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?defina GRAFANA_PASSWORD no .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [conexao-solidaria]

volumes:
  postgres-data:
  mongo-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:

networks:
  conexao-solidaria:
    driver: bridge
