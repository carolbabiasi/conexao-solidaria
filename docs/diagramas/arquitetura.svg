<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" width="1280" height="850" role="img" aria-labelledby="titulo descricao" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, Liberation Sans, DejaVu Sans, sans-serif">
  <title id="titulo">Conexão Solidária — arquitetura</title>
  <desc id="descricao">A API recebe a doação e grava a intenção junto da mensagem na mesma transação do PostgreSQL. O outbox entrega o evento ao RabbitMQ, o Worker consome, registra no ledger do MongoDB com índice único para garantir idempotência e incrementa o valor arrecadado da campanha com um UPDATE atômico. O Worker é o único escritor desse valor. API e Worker expõem métricas para o Prometheus, lidas no Grafana.</desc>

  <defs>
    <marker id="setaEscura" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="setaAssinc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
    <marker id="setaObs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <rect width="1280" height="850" fill="#ffffff"/>

  <text x="40" y="46" font-size="23" font-weight="700" fill="#0f172a">Conexão Solidária — arquitetura</text>
  <text x="40" y="72" font-size="14" fill="#475569">A API nunca atualiza o valor arrecadado. Ela aceita a intenção e responde 202. O Worker é o único escritor do total.</text>

  <!-- ===================== fronteira do cluster ===================== -->
  <rect x="272" y="108" width="968" height="626" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="290" y="134" font-size="13" font-weight="600" fill="#475569">Kubernetes · namespace conexao-solidaria</text>

  <!-- ===================== clientes ===================== -->
  <text x="40" y="150" font-size="13" font-weight="600" fill="#475569">Clientes</text>

  <rect x="40" y="164" width="204" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="56" y="188" font-size="14" font-weight="600" fill="#0f172a">Público</text>
  <text x="56" y="208" font-size="12" fill="#475569">GET /publico/campanhas</text>

  <rect x="40" y="244" width="204" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="56" y="268" font-size="14" font-weight="600" fill="#0f172a">Doador · JWT</text>
  <text x="56" y="288" font-size="12" fill="#475569">POST /doacoes</text>

  <rect x="40" y="324" width="204" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="56" y="348" font-size="14" font-weight="600" fill="#0f172a">GestorONG · JWT</text>
  <text x="56" y="368" font-size="12" fill="#475569">POST /campanhas</text>

  <path d="M 244 194 L 314 200" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#setaEscura)"/>
  <path d="M 244 274 L 314 212" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#setaEscura)"/>
  <path d="M 244 354 L 314 224" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#setaEscura)"/>

  <!-- ===================== API ===================== -->
  <rect x="320" y="162" width="212" height="96" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="336" y="188" font-size="16" font-weight="700" fill="#0c4a6e">GestorONG.API</text>
  <text x="336" y="209" font-size="12" fill="#075985">2 réplicas · ASP.NET Core</text>
  <text x="336" y="228" font-size="12" fill="#075985">responde 202 Accepted</text>
  <rect x="336" y="236" width="66" height="17" rx="8" fill="#ffffff" stroke="#0284c7"/>
  <text x="345" y="248" font-size="10" fill="#0369a1">/metrics</text>

  <!-- ===================== RabbitMQ ===================== -->
  <rect x="320" y="342" width="212" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="336" y="370" font-size="16" font-weight="700" fill="#78350f">RabbitMQ</text>
  <text x="336" y="392" font-size="12" fill="#92400e">fila DoacaoRecebidaEvent</text>
  <text x="336" y="410" font-size="12" fill="#92400e">retry exponencial 3x</text>

  <!-- ===================== Worker ===================== -->
  <rect x="320" y="470" width="212" height="102" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="336" y="496" font-size="16" font-weight="700" fill="#0c4a6e">GestorONG.Worker</text>
  <text x="336" y="517" font-size="12" fill="#075985">2 réplicas · consumer</text>
  <text x="336" y="536" font-size="12" fill="#075985">idempotente</text>
  <rect x="336" y="544" width="66" height="17" rx="8" fill="#ffffff" stroke="#0284c7"/>
  <text x="345" y="556" font-size="10" fill="#0369a1">/metrics</text>

  <!-- ===================== PostgreSQL ===================== -->
  <g>
    <path d="M 920 178 v 106 a 110 26 0 0 0 220 0 v -106 z" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <ellipse cx="1030" cy="178" rx="110" ry="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="1030" y="184" font-size="16" font-weight="700" fill="#14532d" text-anchor="middle">PostgreSQL</text>
    <text x="1030" y="222" font-size="12" fill="#166534" text-anchor="middle">usuarios · campanhas</text>
    <text x="1030" y="242" font-size="12" fill="#166534" text-anchor="middle">doacoes · outbox</text>
    <text x="1030" y="266" font-size="12" font-weight="600" fill="#14532d" text-anchor="middle">valor_arrecadado</text>
  </g>

  <!-- ===================== MongoDB ===================== -->
  <g>
    <path d="M 920 456 v 100 a 110 26 0 0 0 220 0 v -100 z" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <ellipse cx="1030" cy="456" rx="110" ry="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="1030" y="462" font-size="16" font-weight="700" fill="#14532d" text-anchor="middle">MongoDB</text>
    <text x="1030" y="498" font-size="12" fill="#166534" text-anchor="middle">doacoes_processadas</text>
    <text x="1030" y="518" font-size="12" fill="#166534" text-anchor="middle">ledger append-only</text>
    <text x="1030" y="540" font-size="12" font-weight="600" fill="#14532d" text-anchor="middle">índice único idDoacao</text>
  </g>

  <!-- ===================== fluxo 1: API grava ===================== -->
  <path d="M 532 200 L 914 200" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#setaEscura)"/>
  <text x="560" y="176" font-size="12.5" font-weight="600" fill="#0f172a">1 · doação + mensagem na MESMA transação</text>
  <text x="560" y="192" font-size="11.5" fill="#475569">nada de dupla escrita: outbox transacional</text>

  <!-- ===================== fluxo 2: outbox entrega ===================== -->
  <path d="M 946 296 C 850 372, 690 336, 538 372" stroke="#c2410c" stroke-width="2.4" fill="none" stroke-dasharray="9 5" marker-end="url(#setaAssinc)"/>
  <text x="700" y="322" font-size="12.5" font-weight="600" fill="#9a3412">2 · outbox entrega o evento</text>

  <!-- ===================== fluxo 3: consome ===================== -->
  <path d="M 426 422 L 426 464" stroke="#c2410c" stroke-width="2.4" fill="none" stroke-dasharray="9 5" marker-end="url(#setaAssinc)"/>
  <text x="440" y="450" font-size="12.5" font-weight="600" fill="#9a3412">3 · consome</text>

  <!-- ===================== fluxo 4: ledger ===================== -->
  <path d="M 532 522 L 914 506" stroke="#c2410c" stroke-width="2.4" fill="none" stroke-dasharray="9 5" marker-end="url(#setaAssinc)"/>
  <text x="648" y="548" font-size="12.5" font-weight="600" fill="#9a3412">4 · insert com índice único</text>
  <text x="648" y="565" font-size="11.5" fill="#7c2d12">se já existe, é redelivery: descarta sem somar</text>

  <!-- ===================== fluxo 5: update atomico ===================== -->
  <path d="M 480 464 L 984 300" stroke="#c2410c" stroke-width="2.4" fill="none" stroke-dasharray="9 5" marker-end="url(#setaAssinc)"/>
  <text x="600" y="448" font-size="12.5" font-weight="600" fill="#9a3412">5 · UPDATE atômico</text>
  <text x="600" y="464" font-size="11.5" fill="#7c2d12">valor_arrecadado = valor_arrecadado + @valor</text>

  <rect x="600" y="472" width="280" height="24" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="613" y="489" font-size="12" font-weight="700" fill="#991b1b">o Worker é o ÚNICO que escreve esse valor</text>

  <!-- ===================== observabilidade ===================== -->
  <rect x="320" y="630" width="170" height="66" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="336" y="656" font-size="14" font-weight="700" fill="#4c1d95">kubelet / cAdvisor</text>
  <text x="336" y="676" font-size="11.5" fill="#5b21b6">CPU e memória por pod</text>

  <rect x="620" y="630" width="196" height="66" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="636" y="656" font-size="14" font-weight="700" fill="#4c1d95">Prometheus</text>
  <text x="636" y="676" font-size="11.5" fill="#5b21b6">scrape /metrics dos pods</text>

  <rect x="880" y="630" width="196" height="66" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="896" y="656" font-size="14" font-weight="700" fill="#4c1d95">Grafana</text>
  <text x="896" y="676" font-size="11.5" fill="#5b21b6">dashboard provisionado</text>

  <path d="M 490 663 L 614 663" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#setaObs)"/>
  <path d="M 816 663 L 874 663" stroke="#6d28d9" stroke-width="2" fill="none" marker-end="url(#setaObs)"/>
  <path d="M 520 572 L 640 624" stroke="#6d28d9" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#setaObs)"/>

  <!-- ===================== legenda ===================== -->
  <line x1="40" y1="762" x2="1240" y2="762" stroke="#e2e8f0" stroke-width="1"/>

  <line x1="44" y1="792" x2="92" y2="792" stroke="#334155" stroke-width="2"/>
  <text x="102" y="797" font-size="12.5" fill="#334155">HTTP síncrono</text>

  <line x1="240" y1="792" x2="288" y2="792" stroke="#c2410c" stroke-width="2.4" stroke-dasharray="9 5"/>
  <text x="298" y="797" font-size="12.5" fill="#9a3412">fluxo assíncrono da doação (1 a 5)</text>

  <line x1="560" y1="792" x2="608" y2="792" stroke="#6d28d9" stroke-width="2"/>
  <text x="618" y="797" font-size="12.5" fill="#5b21b6">observabilidade</text>

  <rect x="760" y="782" width="22" height="18" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="792" y="797" font-size="12.5" fill="#991b1b">ownership do valor arrecadado</text>

  <text x="1040" y="797" font-size="11.5" fill="#94a3b8">docs/diagramas/arquitetura.svg</text>
</svg>
