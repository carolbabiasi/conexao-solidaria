apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestorong-worker
  namespace: conexao-solidaria
  labels:
    app: gestorong-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gestorong-worker
  template:
    metadata:
      labels:
        app: gestorong-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: worker
          image: ghcr.io/carolbabiasi/conexao-solidaria-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: gestorong-config
            - secretRef:
                name: gestorong-secret
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 600m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gestorong-worker
  namespace: conexao-solidaria
  labels:
    app: gestorong-worker
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: gestorong-worker
  ports:
    - name: http
      port: 8080
      targetPort: 8080
