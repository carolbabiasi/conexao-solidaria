apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: conexao-solidaria
data:
  # O RabbitMQ dimensiona o watermark pela memoria do NO, e nao pelo limite do
  # cgroup: num container de 1Gi ele calculava folga de ~10Gi, nunca estrangulava
  # publicador nenhum, e quem encerrava a festa era o OOM killer - 123 reinicios
  # em cinco dias. Com o valor absoluto abaixo do limite, ele bloqueia publicacao
  # e volta ao normal em vez de morrer.
  #
  # A variavel RABBITMQ_VM_MEMORY_HIGH_WATERMARK faria o mesmo, mas foi
  # descontinuada: o 4.x recusa a subir se ela estiver definida.
  10-memoria.conf: |
    vm_memory_high_watermark.absolute = 600MiB
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  namespace: conexao-solidaria
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: conexao-solidaria
  labels:
    app: rabbitmq
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.0-management-alpine
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          envFrom:
            - secretRef:
                name: gestorong-secret
          volumeMounts:
            - name: config
              mountPath: /etc/rabbitmq/conf.d/10-memoria.conf
              subPath: 10-memoria.conf
            - name: dados
              mountPath: /var/lib/rabbitmq
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_running"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 700m
              memory: 1Gi
      volumes:
        - name: dados
          persistentVolumeClaim:
            claimName: rabbitmq-data
        - name: config
          configMap:
            name: rabbitmq-config
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: conexao-solidaria
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
