name: CI

# Requisito obrigatorio do edital: pipeline acionado a cada push na branch
# principal. O gatilho em pull_request faz cada PR chegar ja validada.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  SOLUTION: GestorONG.slnx

jobs:

  build:
    name: Build (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # A chave inclui Directory.Packages.props porque e la que as versoes
      # dos pacotes vivem (versionamento central, ver INFRA-03).
      - name: Cache de pacotes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      # TreatWarningsAsErrors vem do Directory.Build.props (INFRA-03),
      # entao qualquer aviso derruba este passo.
      - name: Build (Release)
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      # O dominio nao tem dependencia de infraestrutura, entao a suite roda
      # na esteira sem banco, broker nem container.
      - name: Testes de unidade
        run: >
          dotnet test ${{ env.SOLUTION }}
          -c Release
          --no-build
          --logger "trx;LogFileName=testes.trx"
          --results-directory ./TestResults

      - name: Publicar resultado dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-dos-testes
          path: ./TestResults/*.trx
          if-no-files-found: warn
